name: quadruped_pympc_env
# Force ROS 2 to use localhost at startup for safety.
# This value can still be overridden after activating the environment.
variables:
  ROS_LOCALHOST_ONLY: "1"
channels:
- conda-forge
- nvidia
- robostack-staging
dependencies:
- pip
- python
- casadi
- numpy
- matplotlib
- jaxlib=*=*cuda*
- jax
- cuda-nvcc 
- meshcat-python 
- scipy==1.15.1  
- pinocchio
- adam-robotics[all]
- ros-humble-desktop
- ros-humble-rmw-cyclonedds-cpp
- ros-humble-rosidl-generator-dds-idl
- ros-humble-plotjuggler-ros
- compilers 
- cmake 
- pkg-config 
- make 
- ninja 
- colcon-common-extensions 
- tqdm
- gymnasium
- pip:
  - mujoco
  - readchar
  - liecasadi
  - gym-quadruped>=1.1.5

