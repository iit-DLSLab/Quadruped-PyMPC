name: quadruped_pympc_env
# Force ROS 2 to use localhost at startup for safety.
# This value can still be overridden after activating the environment.
variables:
  ROS_LOCALHOST_ONLY: "1"
channels:
- conda-forge
- nvidia
- https://prefix.dev/robostack-lyrical
dependencies:
- pip
- python
- casadi
- numpy
- matplotlib
- meshcat-python 
- scipy
- pinocchio
- adam-robotics[all]
- ros-lyrical-desktop
- ros-lyrical-plotjuggler-ros
- ros-lyrical-rmw-cyclonedds-cpp
- ros-lyrical-rosidl-generator-dds-idl
- compilers 
- cmake 
- pkg-config 
- make 
- ninja 
- colcon-common-extensions 
- tqdm
- gymnasium
- pip:
  - jax[cuda12]
  - mujoco
  - readchar
  - liecasadi
  - gym-quadruped>=1.1.5

