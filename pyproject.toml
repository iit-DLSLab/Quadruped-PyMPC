[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quadruped_pympc"
version = "1.0.0"

[tool.pixi.workspace]
name = "quadruped_pympc_env"
channels = ["conda-forge", "nvidia", "https://prefix.dev/robostack-lyrical"]
platforms = ["linux-64"]
requires-pixi = ">=0.63.0"

[tool.pixi.dependencies]
pip = "*"
python = "*"
casadi = "*"
numpy = "*"
matplotlib = "*"
jax = "*"
meshcat-python = "*"
scipy = "*"
pinocchio = "*"
ros-lyrical-desktop = "*"
ros-lyrical-plotjuggler-ros = "*"
ros-lyrical-rmw-cyclonedds-cpp = "*"
compilers = "*"
cmake = "*"
pkg-config = "*"
make = "*"
ninja = "*"
colcon-common-extensions = "*"
tqdm = "*"
gymnasium = "*"

[tool.pixi.pypi-dependencies]
quadruped_pympc = { path = ".", editable = true }
adam-robotics = { version = "*", extras = ["all"] }
mujoco = "*"
readchar = "*"
liecasadi = "*"
gym-quadruped = "*"

[tool.pixi.feature.no-cuda.dependencies]
jaxlib = "*"

[tool.pixi.feature.cuda.system-requirements]
cuda = "12"

[tool.pixi.feature.cuda.dependencies]
jaxlib = { version = "*", build = "*cuda*" }
cuda-nvcc = "*"

[tool.pixi.environments]
default = ["no-cuda"]
no-cuda = ["no-cuda"]
cuda = ["cuda"]
